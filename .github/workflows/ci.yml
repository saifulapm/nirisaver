name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: build/rust

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Everything above the Wayland module is compositor-free, so this covers
      # the VT parser, the layout, the damage tracking and the incremental
      # rasterizer without a display server. The bench target's smoke path runs
      # here too and compares the incremental buffer against a full-frame
      # oracle.
      - name: Tests
        run: cargo test --all-targets

      # The install instructions promise a Rust toolchain and nothing else. A
      # stock runner has no libxkbcommon, no pkg-config lookup for it and no
      # Qt or GTK development packages to drag it in, so a build that starts
      # needing one fails here rather than on someone's machine. Asserting the
      # link explicitly, because the toolkit re-enabling its default features
      # would otherwise only show up as a build error on a slimmer runner.
      - name: No system library dependencies
        run: |
          cargo build --release
          ldd build/rust/release/nirisaver
          ! ldd build/rust/release/nirisaver | grep -qi xkbcommon
          for lib in $(ldd build/rust/release/nirisaver | awk '{print $1}' | grep '^lib'); do
            case "$lib" in
              libc.so.*|libm.so.*|libgcc_s.so.*|libdl.so.*|libpthread.so.*) ;;
              *) echo "unexpected system library: $lib"; exit 1 ;;
            esac
          done

      # Deterministic by construction: the same seed must print the same line
      # on a CI runner as on a laptop, whatever architecture either is and
      # whatever is sitting in the config directory.
      #
      # The last clause is not hypothetical. The first version of this step
      # failed because `--no-config` skipped config.toml but still read the
      # default quote list, and a quote list draws an RNG value that a plain
      # text block does not — so every later draw shifted, and a machine with
      # quotes installed picked a different effect from one without. A bare
      # runner has no config directory, so the populated case is checked
      # explicitly or a reintroduction would sail through.
      - name: Headless determinism
        run: |
          cargo build --release
          BIN="$PWD/build/rust/release/nirisaver"
          FLAGS="--no-config --headless --frames 400 --cols 72 --rows 20 --seed 4242 --hold 500"
          EXPECTED="grid=72x20 presented=400 engine-frames=637 cycles=1 cells-changed=3793 last-effect=rings checksum=6896f6a1c70f5737"

          bare=$($BIN $FLAGS)
          echo "bare:      $bare"
          test "$bare" = "$(_=1 $BIN $FLAGS)"   # repeatable

          # A config directory that would change everything, if it leaked.
          stuffed=$(mktemp -d)
          mkdir -p "$stuffed/nirisaver"
          printf 'Leaked. — Nobody\nAlso leaked. — No one\n' > "$stuffed/nirisaver/quotes.txt"
          printf 'hold = 1\nwrap = 11\neffect = "matrix"\n' > "$stuffed/nirisaver/config.toml"
          leaky=$(XDG_CONFIG_HOME="$stuffed" HOME="$stuffed" $BIN $FLAGS)
          echo "populated: $leaky"

          test "$bare" = "$EXPECTED"
          test "$leaky" = "$EXPECTED"

          # And the same directory *without* --no-config must be picked up,
          # or the check above would pass for the wrong reason.
          used=$(XDG_CONFIG_HOME="$stuffed" HOME="$stuffed" $BIN --headless --frames 400 \
                   --cols 72 --rows 20 --seed 4242 --hold 500)
          echo "honoured:  $used"
          test "$used" != "$EXPECTED"
